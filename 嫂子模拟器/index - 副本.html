 <!DOCTYPE html>
  <html lang="zh-CN">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>嫂子模拟器 - 楼娱篇</title>
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Serif SC', 'Microsoft YaHei', 'PingFang SC', serif;
    background: #0d0221;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; overflow: hidden;
    user-select: none;
  }

  #game-container {
    width: 1200px; height: 750px;
    background: #faf5ff;
    border-radius: 24px; position: relative; overflow: hidden;
    box-shadow: 0 0 100px rgba(147, 51, 234, 0.4), 0 0 200px rgba(236, 72, 153, 0.2),
                0 20px 60px rgba(0,0,0,0.5);
  }

  .petal {
    position: absolute; pointer-events: none; z-index: 100;
    animation: fall linear infinite; filter: blur(0.5px);
  }
  @keyframes fall {
    0% { transform: translateY(-10vh) rotate(0deg) scale(1); opacity: 0.9; }
    50% { opacity: 0.6; }
    100% { transform: translateY(105vh) rotate(720deg) scale(0.4); opacity: 0; }
  }

  .screen { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
  .screen.active { display: flex; }

  /* ====== TITLE SCREEN ====== */
  #title-screen {
    flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 40%, #1e0a3c 0%, #0d0221 60%, #000 100%);
  }
  .title-stars { position: absolute; width: 100%; height: 100%; }
  .star {
    position: absolute; background: white; border-radius: 50%;
    animation: twinkle var(--dur) infinite alternate;
  }
  @keyframes twinkle { 0% { opacity: 0.2; transform: scale(1); } 100% { opacity: 1; transform: scale(1.5); } }

  .title-decor {
    font-size: 16px; color: rgba(206,147,216,0.7); z-index: 10;
    letter-spacing: 10px; margin-bottom: 16px;
  }
  .title-logo {
    font-size: 58px; font-weight: 900; z-index: 10;
    background: linear-gradient(135deg, #f9a8d4, #c084fc, #f472b6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 40px rgba(236,72,153,0.5));
    letter-spacing: 12px; margin-bottom: 6px;
    animation: logoGlow 3s ease-in-out infinite;
  }
  @keyframes logoGlow {
    0%, 100% { filter: drop-shadow(0 0 40px rgba(236,72,153,0.5)); }
    50% { filter: drop-shadow(0 0 60px rgba(236,72,153,0.8)) drop-shadow(0 0 100px rgba(192,132,252,0.5)); }
  }
  .title-sub { font-size: 20px; color: #c084fc; z-index: 10; letter-spacing: 8px; margin-bottom: 36px; }
  .title-quote {
    font-size: 14px; color: rgba(255,255,255,0.5); z-index: 10;
    font-style: italic; margin-bottom: 48px; text-align: center;
    line-height: 2; max-width: 480px;
  }
  .title-quote::before { content: '❝ '; color: #c084fc; font-size: 20px; }
  .title-quote::after { content: ' ❞'; color: #c084fc; font-size: 20px; }

  .btn {
    padding: 14px 52px; border: none; border-radius: 30px;
    font-size: 16px; font-weight: 700; cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4,0,0.2,1); letter-spacing: 4px;
    font-family: inherit; z-index: 10; position: relative;
  }
  .btn-primary {
    background: linear-gradient(135deg, #ec4899, #a855f7);
    color: white; box-shadow: 0 6px 30px rgba(236,72,153,0.4);
  }
  .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 10px 40px rgba(236,72,153,0.6); }
  .btn-secondary {
    background: rgba(255,255,255,0.08); color: #c084fc;
    border: 2px solid rgba(192,132,252,0.4);
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.15); border-color: #c084fc; }
  .btn-small { padding: 8px 22px; font-size: 13px; letter-spacing: 2px; border-radius: 20px; }
  .btn-danger { background: rgba(239,68,68,0.2); border: 1px solid rgba(239,68,68,0.4); color: #fca5a5; font-size: 12px;
   padding: 7px 18px; letter-spacing: 1px; }
  .btn-danger:hover { background: rgba(239,68,68,0.35); }

  /* ====== SAVE/LOAD MODAL ====== */
  .modal-overlay {
    display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.7); z-index: 200;
    justify-content: center; align-items: center;
  }
  .modal-overlay.active { display: flex; }
  .modal-box {
    background: linear-gradient(180deg, #2d1b4e, #1a0a34);
    border-radius: 20px; padding: 28px 32px; width: 480px; max-height: 70vh;
    overflow-y: auto; border: 1px solid rgba(192,132,252,0.3);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .modal-box h3 { color: #c084fc; font-size: 18px; letter-spacing: 3px; margin-bottom: 16px; text-align: center; }
  .save-slot {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-radius: 14px; margin-bottom: 8px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
    transition: all 0.3s;
  }
  .save-slot:hover { background: rgba(255,255,255,0.1); }
  .save-slot .slot-info { flex: 1; }
  .save-slot .slot-name { color: #e5e7eb; font-size: 14px; font-weight: 600; }
  .save-slot .slot-meta { color: #9ca3af; font-size: 11px; margin-top: 2px; }
  .save-slot .slot-btns { display: flex; gap: 6px; }
  .slot-btn {
    padding: 6px 14px; border-radius: 12px; border: 1px solid rgba(192,132,252,0.3);
    background: rgba(192,132,252,0.1); color: #c084fc; cursor: pointer;
    font-size: 11px; font-family: inherit; letter-spacing: 1px; transition: all 0.3s;
  }
  .slot-btn:hover { background: rgba(192,132,252,0.3); }
  .slot-btn.danger { border-color: rgba(239,68,68,0.3); color: #fca5a5; background: rgba(239,68,68,0.1); }
  .slot-btn.danger:hover { background: rgba(239,68,68,0.25); }

  /* ====== IN-GAME MENU BAR ====== */
  .game-menu-bar {
    position: absolute; top: 0; left: 300px; right: 0; height: 36px;
    background: rgba(15,4,37,0.9); z-index: 50; display: flex;
    align-items: center; justify-content: flex-end; padding: 0 14px; gap: 6px;
  }
  .menu-btn {
    padding: 4px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.04); color: #a78bfa; cursor: pointer;
    font-size: 10px; font-family: inherit; letter-spacing: 1px; transition: all 0.2s;
  }
  .menu-btn:hover { background: rgba(192,132,252,0.2); border-color: #c084fc; color: #c084fc; }

  /* ====== CREATION SCREENS ====== */
  #create-screen, #identity-screen, #target-screen, #attr-screen {
    background: linear-gradient(180deg, #fef3f9 0%, #faf5ff 40%, #f5f0ff 100%);
    flex-direction: column; overflow-y: auto; padding: 24px 40px;
  }
  .create-header { text-align: center; margin-bottom: 16px; }
  .create-header h2 {
    font-size: 26px; background: linear-gradient(135deg, #7c3aed, #db2777);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; letter-spacing: 4px; margin-bottom: 4px;
  }
  .create-header .subtitle { font-size: 13px; color: #a78bfa; letter-spacing: 2px; }
  .create-header .subtitle::before, .create-header .subtitle::after { content: ' · '; color: #c084fc; }

  .create-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px 30px; width: 100%; max-width: 920px; margin: 0 auto;
  }
  .form-group { display: flex; flex-direction: column; }
  .form-group label {
    font-size: 13px; color: #6d28d9; font-weight: 600; margin-bottom: 5px;
    letter-spacing: 1px; display: flex; align-items: center; gap: 6px;
  }
  .form-group label::before { content: '◆'; color: #c084fc; font-size: 8px; }
  .form-group input, .form-group select, .form-group textarea {
    padding: 10px 16px; border: 2px solid #e9d5ff; border-radius: 14px;
    font-size: 14px; background: rgba(255,255,255,0.8); font-family: inherit;
    transition: all 0.3s; outline: none; resize: vertical;
    box-shadow: 0 2px 8px rgba(139,92,246,0.06);
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: #a855f7; box-shadow: 0 0 0 3px rgba(168,85,247,0.1), 0 4px 15px rgba(139,92,246,0.12);
  }
  .form-group textarea { height: 60px; }
  .form-full { grid-column: 1 / -1; }

  /* Identity Cards */
  #identity-screen { background: linear-gradient(180deg, #faf5ff 0%, #f0e6ff 100%); }
  .identity-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 14px; width: 100%; max-width: 960px; margin: 0 auto;
  }
  .identity-card {
    background: white; border-radius: 18px; padding: 18px 16px; cursor: pointer;
    border: 2px solid #e9d5ff; transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 4px 20px rgba(139,92,246,0.06);
    position: relative; overflow: hidden;
  }
  .identity-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, #c084fc, #f472b6); opacity: 0; transition: opacity 0.3s;
  }
  .identity-card:hover { border-color: #c084fc; transform: translateY(-5px); box-shadow: 0 12px 35px
  rgba(139,92,246,0.15); }
  .identity-card:hover::before { opacity: 1; }
  .identity-card.selected { border-color: #7c3aed; background: linear-gradient(135deg, #fef3f9, #faf5ff); box-shadow: 0
  12px 35px rgba(139,92,246,0.25); }
  .identity-card.selected::before { opacity: 1; }
  .identity-card .icon-big { font-size: 36px; margin-bottom: 8px; display: block; }
  .identity-card h3 { font-size: 15px; color: #5b21b6; margin-bottom: 4px; letter-spacing: 1px; }
  .identity-card .role { font-size: 11px; color: #a855f7; margin-bottom: 8px; font-weight: 600; }
  .identity-card .desc { font-size: 11px; color: #6b7280; line-height: 1.6; margin-bottom: 8px; }
  .identity-card .stats { font-size: 10px; color: #db2777; line-height: 1.5; opacity: 0.85; }

  /* Target Grid */
  #target-screen { background: linear-gradient(180deg, #fef3f9, #faf5ff); }
  .target-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 10px; width: 100%; max-width: 920px; margin: 0 auto;
  }
  .target-card {
    background: white; border-radius: 14px; padding: 14px 10px; text-align: center;
    cursor: pointer; border: 2px solid #e9d5ff; transition: all 0.3s;
    box-shadow: 0 3px 12px rgba(0,0,0,0.04);
  }
  .target-card:hover { border-color: #c084fc; transform: translateY(-3px); box-shadow: 0 8px 25px rgba(139,92,246,0.15);
   }
  .target-card.selected { border-color: #ec4899; background: #fef3f9; box-shadow: 0 6px 25px rgba(236,72,153,0.2); }
  .target-card .avatar {
    width: 54px; height: 54px; border-radius: 50%; margin: 0 auto 8px;
    background: linear-gradient(135deg, #fce7f3, #ede9fe);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; border: 2px solid #f0e0f0;
  }
  .target-card h4 { font-size: 13px; color: #5b21b6; letter-spacing: 1px; }
  .target-card .group { font-size: 10px; color: #a78bfa; margin-top: 2px; }

  /* Attr Panel */
  #attr-screen { background: linear-gradient(180deg, #faf5ff, #f0e6ff); }
  .attr-panel {
    background: white; border-radius: 20px; padding: 24px 36px;
    max-width: 680px; margin: 0 auto; width: 100%;
    box-shadow: 0 8px 35px rgba(139,92,246,0.08); border: 1px solid #f0e0f0;
  }
  .attr-row {
    display: flex; align-items: center; margin-bottom: 16px; gap: 12px;
    padding: 10px 14px; border-radius: 12px; background: #faf8ff; transition: background 0.3s;
  }
  .attr-row:hover { background: #f5f0ff; }
  .attr-icon { font-size: 26px; width: 40px; text-align: center; flex-shrink: 0; }
  .attr-info { flex: 1; }
  .attr-name { font-size: 14px; font-weight: 700; color: #4a148c; letter-spacing: 1px; }
  .attr-desc { font-size: 11px; color: #9ca3af; margin-top: 2px; line-height: 1.4; }
  .attr-ctrl { display: flex; align-items: center; gap: 10px; }
  .attr-btn {
    width: 34px; height: 34px; border-radius: 50%; border: 2px solid #c4b5fd;
    background: white; font-size: 18px; cursor: pointer; display: flex;
    align-items: center; justify-content: center; transition: all 0.2s;
    color: #6d28d9; font-weight: bold; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .attr-btn:hover { background: #ede9fe; border-color: #7c3aed; }
  .attr-btn:disabled { opacity: 0.25; cursor: not-allowed; box-shadow: none; }
  .attr-val { font-size: 20px; font-weight: 800; color: #6d28d9; min-width: 32px; text-align: center; }
  .attr-bar-wrap { width: 80px; height: 6px; background: #ede9fe; border-radius: 3px; overflow: hidden; }
  .attr-bar-fill { height: 100%; background: linear-gradient(90deg, #c084fc, #a855f7); border-radius: 3px; transition:
  width 0.4s; }
  .attr-total { text-align: center; font-size: 16px; font-weight: 700; margin-top: 10px; padding: 10px; border-radius:
  12px; letter-spacing: 2px; }
  .attr-total.has-points { color: #db2777; background: #fef3f9; }
  .attr-total.no-points { color: #059669; background: #ecfdf5; }

  /* ====== GAME SCREEN ====== */
  #game-screen { flex-direction: column; background: #faf5ff; }

  .game-menu-bar {
    position: relative; left: auto; height: 34px; min-height: 34px;
    background: #0f0425; z-index: 50; display: flex;
    align-items: center; justify-content: flex-end; padding: 0 12px; gap: 4px;
    flex-shrink: 0;
  }

  .game-main { display: flex; flex: 1; min-height: 0; }

  /* Left Panel */
  .game-left {
    width: 300px; min-width: 300px;
    background: linear-gradient(180deg, #0f0425 0%, #1a0a34 30%, #1e1040 100%);
    color: white; padding: 14px; display: flex; flex-direction: column;
    overflow-y: auto; gap: 8px;
    border-right: 1px solid rgba(192,132,252,0.2);
  }
  .game-left::-webkit-scrollbar { width: 4px; }
  .game-left::-webkit-scrollbar-thumb { background: rgba(192,132,252,0.3); border-radius: 4px; }

  .mini-chara {
    width: 100%; height: 130px; min-height: 130px;
    background: linear-gradient(135deg, rgba(139,92,246,0.3), rgba(236,72,153,0.2));
    border-radius: 14px; display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.08);
  }
  .mini-chara::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 30px;
    background: linear-gradient(transparent, rgba(0,0,0,0.3));
  }
  .mini-chara .chara-body {
    font-size: 60px; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
    animation: charaFloat 3s ease-in-out infinite;
  }
  @keyframes charaFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .panel-block {
    background: rgba(255,255,255,0.04); border-radius: 12px; padding: 10px 12px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .panel-block h3 {
    font-size: 10px; color: #c084fc; letter-spacing: 2px; margin-bottom: 6px;
    font-weight: 600; display: flex; align-items: center; gap: 6px;
  }
  .panel-block h3::after { content: ''; flex: 1; height: 1px; background: rgba(192,132,252,0.2); }

  .stat-row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; padding: 2px 0;
  color: #d1d5db; }
  .stat-row .val { color: #f9a8d4; font-weight: 700; font-size: 12px; }
  .stat-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; margin: 2px 0 4px;
  overflow: hidden; }
  .stat-bar-fill { height: 100%; border-radius: 2px; transition: width 0.6s cubic-bezier(0.4,0,0.2,1); }
  .stat-bar-fill.favor { background: linear-gradient(90deg, #f472b6, #ec4899); box-shadow: 0 0 6px rgba(236,72,153,0.4);
   }
  .stat-bar-fill.trust { background: linear-gradient(90deg, #60a5fa, #3b82f6); box-shadow: 0 0 6px rgba(59,130,246,0.4);
   }
  .stat-bar-fill.intimacy { background: linear-gradient(90deg, #a78bfa, #8b5cf6); box-shadow: 0 0 6px
  rgba(139,92,246,0.4); }
  .stat-bar-fill.risk { background: linear-gradient(90deg, #fbbf24, #ef4444); box-shadow: 0 0 6px rgba(239,68,68,0.4); }
  .stat-bar-fill.love { background: linear-gradient(90deg, #f472b6, #ec4899, #f472b6); box-shadow: 0 0 8px
  rgba(236,72,153,0.6); animation: loveGlow 2s ease-in-out infinite; }
  @keyframes loveGlow {
    0%, 100% { box-shadow: 0 0 8px rgba(236,72,153,0.6); }
    50% { box-shadow: 0 0 16px rgba(236,72,153,0.9); }
  }

  .risk-badge { display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: 10px; font-weight: 700;
  letter-spacing: 1px; }
  .stage-badge { text-align: center; font-size: 10px; padding: 4px 10px; margin-top: 2px; border-radius: 10px;
  letter-spacing: 1px; font-weight: 600; background: rgba(255,255,255,0.06); color: #c084fc; }
  .love-badge { text-align: center; font-size: 10px; padding: 4px 10px; margin-top: 2px; border-radius: 10px;
  letter-spacing: 1px; font-weight: 600; background: rgba(236,72,153,0.2); color: #f9a8d4; animation: loveGlow 2s
  ease-in-out infinite; }

  .action-remaining { display: flex; align-items: center; gap: 5px; margin-top: 2px; font-size: 11px; color: #f9a8d4;
  font-weight: 600; }
  .action-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; transition: all 0.3s; }
  .action-dot.used { background: rgba(255,255,255,0.12); }
  .action-dot.avail { background: #f472b6; box-shadow: 0 0 6px rgba(244,114,182,0.5); }

  /* Right Panel */
  .game-right { flex: 1; display: flex; flex-direction: column; background: #fdfaff; min-width: 0; }

  .scene-area {
    flex: 1; padding: 24px 32px; overflow-y: auto;
    background: linear-gradient(180deg, #fefdfd 0%, #fdfaff 30%, #faf5ff 100%);
    position: relative;
  }
  .scene-area::-webkit-scrollbar { width: 5px; }
  .scene-area::-webkit-scrollbar-thumb { background: #e9d5ff; border-radius: 5px; }

  .scene-week-header {
    display: flex; align-items: center; gap: 14px; margin-bottom: 18px;
    padding-bottom: 14px; border-bottom: 1px solid #f0e0f0;
  }
  .week-badge {
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    color: white; padding: 6px 14px; border-radius: 16px;
    font-size: 12px; font-weight: 700; letter-spacing: 2px; white-space: nowrap;
  }
  .week-divider { flex: 1; height: 1px; background: linear-gradient(90deg, #e9d5ff, transparent); }

  .scene-text { font-size: 15px; line-height: 2.1; color: #374151; letter-spacing: 0.3px; animation: fadeIn 0.4s
  ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .scene-text .highlight { color: #7c3aed; font-weight: 600; }
  .scene-text .emphasis { color: #db2777; font-style: italic; }
  .scene-text .narration { color: #6b7280; }
  .scene-text .thought { color: #9333ea; font-style: italic; }
  .scene-text .divider { display: block; text-align: center; margin: 14px 0; color: #d8b4fe; letter-spacing: 8px;
  font-size: 12px; }

  /* Dialogue Box */
  .dialogue-box {
    background: linear-gradient(180deg, #1a0a34, #0f0425);
    padding: 16px 24px 14px; min-height: 120px; max-height: 240px;
    overflow-y: auto; border-top: 2px solid rgba(192,132,252,0.3);
    position: relative; flex-shrink: 0;
  }
  .dialogue-box::before {
    content: ''; position: absolute; top: -2px; left: 40px; right: 40px;
    height: 2px; background: linear-gradient(90deg, transparent, #c084fc, transparent);
  }
  .dialogue-box::-webkit-scrollbar { width: 4px; }
  .dialogue-box::-webkit-scrollbar-thumb { background: rgba(192,132,252,0.2); border-radius: 4px; }

  .dialogue-speaker { font-size: 10px; color: #c084fc; letter-spacing: 2px; margin-bottom: 4px; font-weight: 600;
  text-transform: uppercase; }
  .dialogue-text { font-size: 14px; color: #f3f4f6; line-height: 1.8; margin-bottom: 10px; animation: fadeIn 0.3s
  ease-out; }
  .choices { display: flex; flex-direction: column; gap: 5px; }
  .choice-btn {
    padding: 10px 16px; border-radius: 14px;
    border: 1.5px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.04); color: #e5e7eb;
    font-size: 12px; cursor: pointer; text-align: left; transition: all 0.3s;
    font-family: inherit; letter-spacing: 0.5px; position: relative;
  }
  .choice-btn:hover {
    background: rgba(236,72,153,0.2); border-color: rgba(236,72,153,0.5);
    transform: translateX(5px); box-shadow: 0 4px 15px rgba(236,72,153,0.15);
  }

    else if(type==='risk') gs.relations.risk=Math.max(0,Math.min(100,gs.relations.risk+amt));
    else if(type==='love') gs.relations.love=Math.max(0,Math.min(100,gs.relations.love+amt));

  // --- Action dispatch ---
  function doAction(descHtml) {
    showScene('<p style="line-height:2.3;font-size:16px">'+descHtml+'</p>');
    gs.remainingActions--;
    updateGameUI();
    checkAchievements();
    checkExposure();
    checkLoveMode();

    if(gs.remainingActions<=0) {
      // Last action - disable actions, show continue button
      showDialogue('⏳ 行动次数已用完', '今日行动结束，准备进入下一时刻……');
      showContinue('进 入 下 一 时 刻 ▸', ()=>advanceTime());
    } else {
      // Not last action - auto-show action selection
      setTimeout(()=>showActionSelection(), 900);
    }
  }

  function getRandomEvent() {
    const
  pools=gs.loveMode?['industry','social','crisis','emotional','love']:['industry','social','crisis','emotional'];
    const pool=pools[Math.floor(Math.random()*pools.length)];
    const events=genEvents()[pool];
    if(!events){return getRandomEvent();} // fallback
    let avail=events.filter(e=>!gs.recentEvents.includes(e.id));
    if(!avail.length){avail=events;gs.recentEvents.length=0;}
    const chosen=avail[Math.floor(Math.random()*avail.length)];
    gs.recentEvents.push(chosen.id);
    if(gs.recentEvents.length>7) gs.recentEvents.shift();
    return chosen;
  }

      showDialogue('🗓️ '+cal.title, '这是一个重要的日子……');
      showContinue('继 续 ▸', ()=>advanceTimeSlot());
      return;

  function advanceTimeSlot() {
    if(gs.day===0 && gs.timeSlot===0 && gs.week%4===0) {
      const decay=1+Math.floor(Math.random()*3);
      changeRel('favor',-decay);
      if(gs.relations.favor>30 && Math.random()<0.5) changeRel('favor',-1);
      if(decay>=2) showNotif('⏰ 疏于接触，好感度衰减-'+decay,'neutral');
    }
    gs.timeSlot++;
    if(gs.timeSlot>=3){gs.timeSlot=0;gs.day++;
      if(gs.day>=7){gs.day=0;gs.week++;
        if(gs.week>gs.totalWeeks){
          // Check for survive achievement
          if(gs.relations.risk<20&&!gs.achievements.survive){gs.achievements.survive=true;}
          if(!gs.achievements.week52)gs.achievements.week52=true;
          triggerEnding();return;
        }
        if(gs.week%4===0) showNotif('📅 第 '+gs.week+' 周了','neutral');
      }
    }
    updateGameUI();
    checkExposure();
    showWeekIntro();
  }

    checkExposure();
    if(!gs.ended) advanceTimeSlot();

  function saveGame(slot) {
    const data={
      player:gs.player, identity:gs.identity, target:gs.target,
      attrs:gs.attrs, relations:gs.relations,
      week:gs.week, day:gs.day, timeSlot:gs.timeSlot,
      remainingActions:gs.remainingActions, eventFlags:gs.eventFlags,
      recentEvents:gs.recentEvents, achievements:gs.achievements,
      loveMode:gs.loveMode,
      savedAt: new Date().toLocaleString()
    };
    localStorage.setItem('sis_save_'+slot, JSON.stringify(data));
    showNotif('💾 存档 '+(slot+1)+' 保存成功！');
    closeModal();
  }

  function loadGame(slot) {
    const raw=localStorage.getItem('sis_save_'+slot);
    if(!raw) { showNotif('该存档为空','warning'); return; }
    try {
      const data=JSON.parse(raw);
      gs.player=data.player; gs.identity=data.identity; gs.target=data.target;
      gs.attrs=data.attrs; gs.relations=data.relations;
      gs.week=data.week; gs.day=data.day; gs.timeSlot=data.timeSlot;
      gs.remainingActions=data.remainingActions;
      gs.eventFlags=data.eventFlags||{};
      gs.recentEvents=data.recentEvents||[];
      gs.achievements=data.achievements||{};
      gs.loveMode=data.loveMode||false;
      gs.ended=false;
      if(!gs.relations.love&&gs.relations.love!==0)gs.relations.love=0;
      showScreen('game-screen'); updateGameUI(); showWeekIntro();
      showNotif('📂 存档 '+(slot+1)+' 读取成功！');
    } catch(e) { showNotif('存档损坏','warning'); }
  }

    localStorage.removeItem('sis_save_'+slot);

      let data=null;
      try{if(raw) data=JSON.parse(raw);}catch(e){}
      const slotDiv=document.createElement('div');
      slotDiv.className='save-slot';
      const info=data?'第'+data.week+'周 · '+(data.player?.name||'???')+' · '+(data.target?.name||'???')+' ·'+(data.savedAt||''):'空存档';
      const name=data?'存档 '+(i+1)+' — 第'+data.week+'周':'存档 '+(i+1)+' — 空';

      slotDiv.innerHTML='<div class="slot-info"><div class="slot-name">'+name+'</div><divclass="slot-meta">'+info+'</div></div><div class="slot-btns"></div>';

      const btns=slotDiv.querySelector('.slot-btns');
      if(mode==='save') {
        const sBtn=document.createElement('button'); sBtn.className='slot-btn';
        sBtn.textContent='保存'; sBtn.onclick=()=>saveGame(i); btns.appendChild(sBtn);
        if(data) {
          const dBtn=document.createElement('button'); dBtn.className='slot-btn danger';
          dBtn.textContent='删除'; dBtn.onclick=()=>deleteSave(i); btns.appendChild(dBtn);
        }
      } else {
        if(data) {
          const lBtn=document.createElement('button'); lBtn.className='slot-btn';
          lBtn.textContent='读取'; lBtn.onclick=()=>loadGame(i); btns.appendChild(lBtn);
        }
      }
      container.appendChild(slotDiv);
    }
  }

  function showSaveModal() { renderSaveSlots('save'); document.getElementById('save-modal').classList.add('active'); }
  function showLoadModal() { renderSaveSlots('load'); document.getElementById('save-modal').classList.add('active'); }
  function showLoadScreen() { renderSaveSlots('load'); document.getElementById('save-modal').classList.add('active'); }
  function closeModal() { document.getElementById('save-modal').classList.remove('active'); }

  function exitToTitle() {
    if(confirm('确定要退出到主菜单吗？\n\n未保存的进度将丢失。')) {
      showScreen('title-screen');
    }
  }

  // ==========================================
  // ACHIEVEMENTS DISPLAY
  // ==========================================
  function showAchievements() {
    const grid=document.getElementById('ach-grid');
    grid.innerHTML='';
    achievementDefs.forEach(a=>{
      const card=document.createElement('div');
      const unlocked=gs.achievements[a.id];
      card.className='ach-card '+(unlocked?'unlocked':'locked');
      card.innerHTML='<span class="ach-icon">'+(unlocked?a.icon:'🔒')+'</span>'+
        '<div class="ach-name">'+a.name+'</div>'+
        '<div class="ach-desc">'+a.desc+'</div>'+
        (unlocked?'<div style="font-size:10px;color:#f9a8d4;margin-top:4px">✓ 已解锁</div>':'<div style="font-size:10px;color:#6b7280;margin-top:4px">未解锁</div>');
      grid.appendChild(card);
    });
    showScreen('achievement-screen');
  }

  // ==========================================
  // ENDINGS
  // ==========================================
  function triggerEnding() {
    gs.ended=true;
    const f=gs.relations.favor, t=gs.relations.trust, i=gs.relations.intimacy, r=gs.relations.risk, l=gs.relations.love,
   m=gs.attrs.mental, tn2=tn();
    let label,title,desc,color;

    if(l>=100){color='#f472b6';label='💒 最高成就 · 百年好合';title='结婚 · 我们的故事';desc=''+tn2+'在演唱会的最后一场上，唱了那首从未发表过的歌。\n\n灯光暗下，TA对着麦克风说："这首歌，写了很久。写给我喜欢的人。"全场安静了三秒，然后尖叫。\n\n但你已经在后台等着了。TA走下台的时候，你伸出手，TA握住。没有言语。\n\n下个月，你们在民政局拍了那张红底白衬衫的照片。TA发了一条微博——一张合影，配文只有两个字："我的。"\n\n评论区爆炸了。但这一次，你们不再害怕。';}
    else if(f>=90&&t>=85&&r<40){color='#f472b6';label='💕 HE · 幸福结局';title='地下恋情 ·稳定版';desc='你们维持着秘密的恋爱关系。'+tn2+'的每个回归期你都在幕后默默支持，你学会了在无人的角落拥抱。\n\n没有公开，但你们都清楚这是真实的。\n\n——在这个圈子里，有些幸福不需要被看见。';}
    else if(f>=95&&t>=90&&gs.eventFlags.survived_scandal){color='#f472b6';label='💕 HE · 幸福结局';title='公开恋爱 ·风暴后的晴天';desc='绯闻爆发时你们没有选择分手，'+tn2+'在风暴中心握住了你的手。公司震怒、粉丝哭诉、热搜爆炸——但一年后，人们习惯了。\n\nTA在演唱会上唱的那首歌，所有人都知道是写给谁的。';}
    else if(f>=60&&gs.eventFlags.separated){color='#f472b6';label='💕 HE · 幸福结局';title='等待 ·退圈后的重逢';desc=''+tn2+'的合约到期那天，你收到了一条没有署名的消息。定位是你们第一次单独吃饭的那家店。推开门，TA穿着便装坐在角落，像一个终于卸下盔甲的普通人。\n\n"好久不见。"TA说。';}
    else if(f>=60&&r>=80&&i>=40){color='#9ca3af';label='💔 BE · 遗憾结局';title='体面分手';desc='最后一次见面，'+tn2+'把你送到出租车上，说"谢谢你，对不起"。你没有回头，因为你知道回头就走不了了。\n\n有些感情不是不够深，只是不够幸运。';}
    else if(f<=-30&&t<=20){color='#9ca3af';label='💔 BE · 遗憾结局';title='粉转黑 ·信任崩塌';desc=''+tn2+'看你的眼神变了。从温暖变成失望，从失望变成陌生。你终于明白，有些东西碎了就是碎了。\n\n你删掉了所有照片——但是，你还是会在深夜搜索TA的名字。';}
    else if(r>=85&&m<=30){color='#9ca3af';label='💔 BE · 遗憾结局';title='网暴吞噬';desc='几万条辱骂、人肉搜索、P图造谣。你删掉了所有社交账号，换了手机号码，搬离了北京。\n\n一年后你在另一个城市看到TA的海报，站了很久，然后继续走。';}
    else{color='#c084fc';label='🌅开放结局';title='未完待续';desc='你们之间什么都没有发生，又好像什么都发生了。TA记得你喜欢的咖啡口味，你知道TA压力大时会揉后颈。\n\n但每次TA在舞台上看向观众席的某个方向时，你总觉得那是你的位置。\n\n故事没有结束，只是暂时告一段落。';}

    document.getElementById('ending-type-label').textContent=label;
    document.getElementById('ending-type-label').style.color=color;
    document.getElementById('ending-title').textContent=title;
    document.getElementById('ending-desc').textContent=desc;
    document.getElementById('ending-stats').innerHTML='好感度 '+f+' · 信任度 '+t+' · 亲密度 '+i+' · 曝光风险 '+r+(gs.loveMode?' · 爱情值 '+l:'')+'<br>身份：'+(gs.identity?gs.identity.name:'---')+' · 目标：'+tn2;
    showScreen('ending-screen');
  }

  // ==========================================
  // CREATION FLOW
  // ==========================================
  function confirmCreate() {
    gs.player={
      name:document.getElementById('c-name').value||'林悦',
      gender:document.getElementById('c-gender').value,
      age:parseInt(document.getElementById('c-age').value)||23,
      nationality:document.getElementById('c-nationality').value,
      appearance:document.getElementById('c-appearance').value||'清秀干净',
      personality:document.getElementById('c-personality').value,
      fanHistory:document.getElementById('c-fan-history').value||'',
      selfDesc:document.getElementById('c-self-desc').value||''
    };
    showScreen('identity-screen'); renderIdentities();
  }
  function renderIdentities() {
    const grid=document.getElementById('identity-grid'); grid.innerHTML='';
    identities.forEach(idn=>{
      const card=document.createElement('div'); card.className='identity-card';
      card.innerHTML='<span class="icon-big">'+idn.icon+'</span><h3>'+idn.name+'</h3><div class="role">'+idn.role+'</div><div class="desc">'+idn.desc+'</div><div class="stats">'+idn.stats+'</div>';
      card.onclick=()=>{document.querySelectorAll('.identity-card').forEach(c=>c.classList.remove('selected'));card.classList.add('selected');gs.identity=idn;document.getElementById('btn-confirm-identity').disabled=false;};
      grid.appendChild(card);
    });
  }

  function confirmIdentity() { showScreen('target-screen');
    const grid=document.getElementById('target-grid'); grid.innerHTML='';
    targets.forEach(t=>{
      const card=document.createElement('div'); card.className='target-card';
      card.innerHTML='<div class="avatar">'+t.emoji+'</div><h4>'+t.name+'</h4><div class="group">'+t.group+'</div>';
      card.onclick=()=>{document.querySelectorAll('.target-card').forEach(c=>c.classList.remove('selected'));card.classList.add('selected');gs.target=t;document.getElementById('btn-confirm-target').disabled=false;};
      grid.appendChild(card);
    });
  }

  let attrPool=15;
  function confirmTarget(){showScreen('attr-screen');gs.attrs={charm:5,eq:5,professional:5,stealth:5,connections:5,mental:5};attrPool=15;renderAttrPanel();}
  function renderAttrPanel(){
    const panel=document.getElementById('attr-panel');panel.innerHTML='';
    attrDefs.forEach(a=>{
      const row=document.createElement('div');row.className='attr-row';
      row.innerHTML='<div class="attr-icon">'+a.icon+'</div><div class="attr-info"><div class="attr-name">'+a.name+'</div><div class="attr-desc">'+a.desc+'</div></div><div class="attr-bar-wrap"><div class="attr-bar-fill" id="ab-'+a.id+'" style="width:'+(gs.attrs[a.id]/15*100)+'%"></div></div><div class="attr-ctrl"><button class="attr-btn" data-a="'+a.id+'" data-d="-1">-</button><div class="attr-val" id="av-'+a.id+'">'+gs.attrs[a.id]+'</div><button class="attr-btn" data-a="'+a.id+'" data-d="1">+</button></div>';
      panel.appendChild(row);
    });
    const total=document.createElement('div');total.className='attr-total has-points';total.id='attr-total';total.textContent='剩余点数：'+attrPool;panel.appendChild(total);
    panel.querySelectorAll('.attr-btn').forEach(btn=>{btn.onclick=()=>{
      const id=btn.dataset.a,d=parseInt(btn.dataset.d);
      if(d>0&&(attrPool<=0||gs.attrs[id]>=15))return;
      if(d<0&&gs.attrs[id]<=0)return;
      gs.attrs[id]+=d;attrPool-=d;
      document.getElementById('av-'+id).textContent=gs.attrs[id];
      document.getElementById('ab-'+id).style.width=(gs.attrs[id]/15*100)+'%';
      const tel=document.getElementById('attr-total');tel.textContent='剩余点数：'+attrPool;tel.className='attr-total '+(attrPool>0?'has-points':'no-points');
      document.getElementById('btn-confirm-attr').disabled=attrPool!==0;
      document.getElementById('attr-sub').textContent=attrPool>0?'剩余点数：'+attrPool:'分配完毕 ✓';
    };});
  }
  function confirmAttributes(){
    const b=gs.identity?gs.identity.bonuses:{};
    if(b.professional)gs.attrs.professional+=b.professional;
    if(b.charm)gs.attrs.charm+=b.charm;
    if(b.connections)gs.attrs.connections+=b.connections;
    if(b.intimacy_base)gs.relations.intimacy+=b.intimacy_base;
    if(b.trust_barrier)gs.relations.trust=Math.max(0,gs.relations.trust-b.trust_barrier);
    if(b.risk_mod)gs.relations.risk+=b.risk_mod;
    if(b.stealth!==undefined&&b.stealth<0)gs.attrs.stealth=Math.max(0,gs.attrs.stealth+b.stealth);
    showScreen('game-screen');updateGameUI();showWeekIntro();
  }

  function startQuickGame(){
    gs.player={name:'林悦',gender:'女',age:23,nationality:'中国',appearance:'清秀干净，笑起来有酒窝',personality:'温柔',fanHistory:'3年，追过TNT',selfDesc:'一个怀揣梦想来到北京的普通女孩。'};
    gs.identity=identities[0];gs.target=targets[0];
    gs.attrs={charm:7,eq:9,professional:8,stealth:6,connections:8,mental:7};
    gs.relations={favor:0,trust:2,intimacy:0,risk:5,love:0};
    gs.week=1;gs.day=0;gs.timeSlot=0;gs.remainingActions=2;gs.eventFlags={};gs.recentEvents=[];
    gs.achievements={};gs.loveMode=false;gs.ended=false;
    showScreen('game-screen');updateGameUI();showWeekIntro();
  }

  // ==========================================
  // INIT
  // ==========================================
  function init(){
    const starsEl=document.getElementById('stars');
    for(let i=0;i<60;i++){const star=document.createElement('div');star.className='star';star.style.cssText='left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;width:'+(1+Math.random()*2.5)+'px;height:'+(1+Math.random()*2.5)+'px;--dur:'+(1.5+Math.random()*2)+'s;animation-delay:'+Math.random()*3+'s';starsEl.appendChild(star);}
    const container=document.getElementById('game-container');
    const petalChars=['🌸','💮','✿','❀','🌷'];
    for(let i=0;i<18;i++){const petal=document.createElement('div');petal.className='petal';petal.textContent=petalChars[Math.floor(Math.random()*petalChars.length)];petal.style.cssText='left:'+Math.random()*100+'%;font-size:'+(8+Math.random()*18)+'px;animation-duration:'+(7+Math.random()*14)+'s;animation-delay:'+Math.random()*12+'s';container.appendChild(petal);}
    renderIdentities();
  }
  init();
  </script>

  </html>
